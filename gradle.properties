# Project-wide Gradle settings
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.configuration-cache=false
kotlin.code.style=official

# AndroidX
android.useAndroidX=true
android.enableJetpackCompose=true

# Compose
android.compose.compilerReports=true
android.compose.compilerMetrics=true
android.compose.compilerCompatibilityMode=STRONG_SKIPPING

# Kotlin Serialization
kotlinx.serialization.useFastJson=true

# KMP (iOS targets disabled on Windows — expected)
kotlin.native.ignoreDisabledTargets=true
kotlin.mpp.androidGradlePluginCompatibility.nowarn=true

# Hilt
hilt.dagger.experimentalDaggerErrorMessages=true

# KSP — stay on KSP1 (KSP2 hits Hilt/Room signature errors on this toolchain)
ksp.useKSP2=false
ksp.incremental=false

# Disable broken JDK detection from environment variables
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.auto-download=true