# Project-wide Gradle settings
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=false
org.gradle.configuration-cache=false
kotlin.code.style=official

# AndroidX
android.useAndroidX=true
android.enableJetpackCompose=true

# Compose
android.compose.compilerReports=true
android.compose.compilerMetrics=true
android.compose.compilerCompatibilityMode=STRONG_SKIPPING

# Kotlin Serialization
kotlinx.serialization.useFastJson=true

# Hilt
hilt.dagger.experimentalDaggerErrorMessages=true

# KSP
ksp.useKSP2=false

# Disable broken JDK detection from environment variables
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.auto-download=true