# Render Blueprint — StudentAI backend
# Deploy: push this repo to GitHub, then open
# https://dashboard.render.com/blueprint/new?repo=<YOUR_REPO_URL>
services:
  - type: web
    name: studentai-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # Set API keys in Render Dashboard (Secret) — never commit real keys to git.
      - key: TEXT_AI_API_KEY
        sync: false
      - key: VISION_AI_API_KEY
        sync: false
      - key: TEXT_AI_BASE_URL
        value: https://api.hcnsec.cn/v1
      - key: TEXT_MODEL
        value: auto
      - key: VISION_AI_BASE_URL
        value: https://freetokenfaucet.com/v1
      - key: VISION_MODEL
        value: mimo-v2.5-pro
