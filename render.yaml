# Render Blueprint — StudentAI backend
# Deploy: push this repo to GitHub, then open
# https://dashboard.render.com/blueprint/new?repo=<YOUR_REPO_URL>
services:
  - type: web
    name: studentai-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # Set AI_API_KEY in Render Dashboard (Secret) — never commit the real key to git.
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: mimo-v2.5
      - key: TEXT_MODEL
        value: auto
      - key: AI_BASE_URL
        value: https://freetokenfaucet.com/v1
