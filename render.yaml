# Render Blueprint — SchedMate backend + download site
# Deploy: push this repo to GitHub, then open
# https://dashboard.render.com/blueprint/new?repo=<YOUR_REPO_URL>
services:
  - type: web
    name: studentai-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # Set API key in Render Dashboard (Secret) — never commit real keys to git.
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://api.hcnsec.cn/v1
      - key: AI_MODEL
        value: auto
      - key: TEXT_MODEL
        value: auto
      - key: VISION_MODEL
        value: MiniMax-M3
      # Schedule scanning routes through NVIDIA NIM when this key is present.
      # Base URL + vision model have safe defaults in server.js.
      - key: SCAN_AI_API_KEY
        sync: false
      # OrcaRouter for fast vision (~5-12s). Free tier: 10 RPM, $0 forever.
      # Falls back to VISION_MODEL (MiniMax-M3) on rate limit or error.
      - key: ORCA_API_KEY
        sync: false
      - key: ORCA_BASE_URL
        value: https://api.orcarouter.ai/v1
      # Cerebras for fast non-thinking text chat. Free tier, OpenAI-compatible.
      # Thinking (agnes slug) stays on hcnsec auto; vision stays OrcaRouter -> MiniMax-M3.
      - key: CEREBRAS_API_KEY
        sync: false
      - key: CEREBRAS_MODEL
        value: qwen-3.8-27b
      # Gemini embeddings for JEVI source citations. Free tier (AI Studio,
      # no card): ~1,500 req/day. Batch document embeds; 768 dims keeps
      # per-user vector rows small. Key is per-deployer secret, never committed.
      - key: GEMINI_EMBEDDING_API_KEY
        sync: false
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: GEMINI_EMBEDDING_DIMS
        value: 768

  - type: static_site
    name: studentai-download
    plan: free
    rootDir: download-site
    buildCommand: echo "Static download site — no build step"
    staticPublishPath: ./
