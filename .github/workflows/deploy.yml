name: Deploy to Render

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render (auto-deploy handles the rest)
        run: |
          echo "Pushed to master — Render auto-deploy will pick this up from the linked GitHub repo."
          echo "Commit: ${{ github.sha }}"
          echo "Verified via GitHub webhook to Render."
